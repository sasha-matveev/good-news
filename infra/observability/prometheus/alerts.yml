groups:
  - name: good-news-runtime
    rules:
      - alert: GoodNewsContentApiDown
        expr: up{job="content-api-service"} == 0
        for: 2m
        labels:
          severity: critical
          subsystem: runtime
        annotations:
          summary: Content API service is unavailable.
      - alert: GoodNewsSourceIngestionDown
        expr: up{job="source-ingestion-service"} == 0
        for: 2m
        labels:
          severity: critical
          subsystem: runtime
        annotations:
          summary: Source ingestion service is unavailable.
      - alert: GoodNewsAnalysisServiceDown
        expr: up{job="analysis-llm-service"} == 0
        for: 2m
        labels:
          severity: critical
          subsystem: runtime
        annotations:
          summary: Analysis LLM service is unavailable.
      - alert: GoodNewsDeliveryServiceDown
        expr: up{job="delivery-service"} == 0
        for: 2m
        labels:
          severity: critical
          subsystem: runtime
        annotations:
          summary: Delivery service is unavailable.
      - alert: GoodNewsRepeatedSourceFailures
        expr: increase(good_news_source_sync_failures_total{event_code="source.repeated_failure"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
          subsystem: source-sync
        annotations:
          summary: Source sync reached the repeated-failure threshold.
      - alert: GoodNewsAnalysisWriteFailures
        expr: increase(good_news_analysis_failures_total{reason="write_failed"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
          subsystem: analysis
        annotations:
          summary: Analysis writes failed during recent source syncs.
      - alert: GoodNewsObservabilityReportFailed
        expr: increase(good_news_delivery_runs_total{digest_type="observability_daily",status="failed"}[24h]) > 0
        for: 0m
        labels:
          severity: warning
          subsystem: observability
        annotations:
          summary: The daily observability report failed to render or send.
