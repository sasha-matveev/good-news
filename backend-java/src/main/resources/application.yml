spring:
  application:
    name: backend-java

good-news:
  ingestion:
    bulk-concurrency: ${GOOD_NEWS_INGESTION_BULK_CONCURRENCY:4}

management:
  health:
    r2dbc:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
