[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "good-news-backend"
version = "0.1.0"
description = "Backend for the Good News cloud runtime."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "fastapi>=0.115,<1.0",
    "google-auth>=2.35,<3.0",
    "httpx>=0.27,<1.0",
    "prometheus-client>=0.21,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "requests>=2.32,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
# Prepend this directory (rootdir) so the local `app` package is imported even
# when an editable install on sys.path points elsewhere (e.g. a git worktree
# sharing the parent checkout's editable install).
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
