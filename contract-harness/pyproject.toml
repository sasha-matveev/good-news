[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "good-news-contract-harness"
version = "0.1.0"
description = "Differential HTTP and persisted-state contract harness for Good News."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
good-news-contract = "good_news_contract.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

