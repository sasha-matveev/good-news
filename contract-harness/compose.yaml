name: good-news-contract

x-backend-environment: &backend-environment
  GOOD_NEWS_ENV: contract
  GOOD_NEWS_POSTGRES_DATABASE: good_news
  GOOD_NEWS_POSTGRES_USER: good_news
  GOOD_NEWS_POSTGRES_PASSWORD: good-news-contract
  GOOD_NEWS_APP_MASTER_KEY: contract-master-key
  GOOD_NEWS_PUBLIC_FRONTEND_ORIGIN: https://frontend.contract.test
  GOOD_NEWS_PUBLIC_CONTENT_API_ORIGIN: https://api.contract.test
  GOOD_NEWS_SCHEDULER_INVOKER: scheduler@contract.test
  GOOD_NEWS_OIDC_AUDIENCE: https://jobs.contract.test
  GOOD_NEWS_ANALYSIS_STUB_RESPONSE_JSON: >-
    {"summary_ru":"Детерминированный ответ","topics":["platform"],"format":"article","technical_depth":"medium","verdict":"interesting","verdict_reason":"Useful.","relevance_score":8}
  GOOD_NEWS_FIXED_NOW: "2026-04-26T12:00:00Z"
  GOOD_NEWS_CONTRACT_AUTH_TOKENS_JSON: >-
    {"allowed-user":{"email":"reader@contract.test","email_verified":true},"forbidden-user":{"email":"outsider@contract.test","email_verified":true},"scheduler":{"email":"scheduler@contract.test","email_verified":true}}
  GOOD_NEWS_INGESTION_RESPONSES_JSON: >-
    {"https://sources.contract.test/alpha/feed":"<rss><channel></channel></rss>","https://sources.contract.test/beta/feed":"<rss><channel></channel></rss>"}

services:
  postgres-python:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: good_news
      POSTGRES_USER: good_news
      POSTGRES_PASSWORD: good-news-contract
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U good_news -d good_news"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-java:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: good_news
      POSTGRES_USER: good_news
      POSTGRES_PASSWORD: good-news-contract
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U good_news -d good_news"]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate-python:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-environment
      GOOD_NEWS_POSTGRES_HOST: postgres-python
    command: ["python", "-m", "app.core.migration_runner"]
    depends_on:
      postgres-python:
        condition: service_healthy

  python:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-environment
      GOOD_NEWS_POSTGRES_HOST: postgres-python
    ports:
      - "18000:8000"
    depends_on:
      migrate-python:
        condition: service_completed_successfully
      boundaries:
        condition: service_healthy

  python-auth:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-environment
      GOOD_NEWS_POSTGRES_HOST: postgres-python
      GOOD_NEWS_FIREBASE_PROJECT_ID: contract-project
      GOOD_NEWS_ALLOWED_EMAILS: reader@contract.test
    ports:
      - "18001:8000"
    depends_on:
      migrate-python:
        condition: service_completed_successfully
      boundaries:
        condition: service_healthy

  java:
    build:
      context: ..
      dockerfile: backend-java/Dockerfile
    environment:
      <<: *backend-environment
      GOOD_NEWS_POSTGRES_HOST: ${GOOD_NEWS_JAVA_POSTGRES_HOST:-postgres-java}
      SPRING_FLYWAY_ENABLED: ${GOOD_NEWS_JAVA_FLYWAY_ENABLED:-true}
      SERVER_PORT: "8080"
    ports:
      - "18080:8080"
    depends_on:
      postgres-java:
        condition: service_healthy
      migrate-python:
        condition: service_completed_successfully
      boundaries:
        condition: service_healthy

  java-auth:
    build:
      context: ..
      dockerfile: backend-java/Dockerfile
    environment:
      <<: *backend-environment
      GOOD_NEWS_POSTGRES_HOST: ${GOOD_NEWS_JAVA_POSTGRES_HOST:-postgres-java}
      GOOD_NEWS_FIREBASE_PROJECT_ID: contract-project
      GOOD_NEWS_ALLOWED_EMAILS: reader@contract.test
      SERVER_PORT: "8080"
      SPRING_FLYWAY_ENABLED: ${GOOD_NEWS_JAVA_FLYWAY_ENABLED:-true}
    ports:
      - "18081:8080"
    depends_on:
      postgres-java:
        condition: service_healthy
      migrate-python:
        condition: service_completed_successfully
      boundaries:
        condition: service_healthy

  boundaries:
    build:
      context: ..
      dockerfile: contract-harness/Dockerfile.adapters
    ports:
      - "18090:8090"
      - "12525:2525"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 2s
      timeout: 2s
      retries: 30
