name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - master
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        type: choice
        options:
          - validate
          - deploy
        default: validate
        required: true
      candidate_run_id:
        description: Successful CI run ID (required for deploy)
        type: string
        required: false
      candidate_sha:
        description: Verified 40-character commit SHA (required for deploy)
        type: string
        required: false

permissions:
  contents: read

env:
  RUN_URL: https://good-news-app-446870476468.us-central1.run.app

jobs:
  validate-deploy-toolchain:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master' &&
      inputs.operation == 'validate'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        id: gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          cache: false

      - name: Report gcloud version and authenticated identity
        run: |
          echo "Expected gcloud version: >= 363.0.0"
          echo "Installed gcloud version: ${{ steps.gcloud.outputs.version }}"
          gcloud version
          gcloud auth list --filter=status:ACTIVE
          gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" \
            --format="value(projectId)"

      - name: Validate Artifact Registry access
        run: |
          gcloud auth configure-docker \
            "${{ vars.GCP_REGION }}-docker.pkg.dev" \
            --quiet
          gcloud artifacts repositories describe good-news \
            --location="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(name)"

      - name: Validate Cloud Run job access
        run: |
          gcloud run jobs deploy --help >/dev/null
          gcloud run jobs execute --help >/dev/null
          gcloud run jobs describe db-migrate \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(metadata.name)"

      - name: Validate Cloud Run service access
        run: |
          gcloud run deploy --help >/dev/null
          gcloud run services describe good-news-app \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(metadata.name)"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate Firebase Hosting access
        run: |
          npx --yes firebase-tools@latest deploy --help >/dev/null
          npx --yes firebase-tools@latest hosting:sites:list \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

  resolve-candidate:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/master' &&
       inputs.operation == 'deploy')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.resolve.outputs.run_id }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve and verify successful CI candidate
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTO_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.candidate_run_id }}
          MANUAL_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            run_id="$AUTO_RUN_ID"
            candidate_sha="$AUTO_SHA"
          else
            run_id="$MANUAL_RUN_ID"
            candidate_sha="$MANUAL_SHA"
          fi

          [[ "$run_id" =~ ^[0-9]+$ ]]
          [[ "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > run.json
          test "$(jq -r '.name' run.json)" = CI
          test "$(jq -r '.event' run.json)" = push
          test "$(jq -r '.head_branch' run.json)" = master
          test "$(jq -r '.head_sha' run.json)" = "$candidate_sha"
          test "$(jq -r '.conclusion' run.json)" = success

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > jobs.json
          test "$(jq '[.jobs[] | select(.name == "Quality gate" and .conclusion == "success")] | length' jobs.json)" = 1

          latest_master_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq '.sha')
          test "$candidate_sha" = "$latest_master_sha"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$candidate_sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve-candidate
    if: needs.resolve-candidate.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CANDIDATE_RUN_ID: ${{ needs.resolve-candidate.outputs.run_id }}
      CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
    steps:
      - name: Download release manifest
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ env.CANDIDATE_SHA }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}

      - name: Download production frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-release-${{ env.CANDIDATE_SHA }}
          path: candidate/frontend
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}

      - name: Validate release manifest and frontend digest
        id: manifest
        run: |
          manifest=candidate/release-manifest.json
          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            --arg run_id "$CANDIDATE_RUN_ID" \
            '.schema_version == 1 and
             .source_sha == $sha and
             .source_run_id == $run_id and
             .backend.image == (.backend.image | sub("@.*$"; "")) + "@" + .backend.digest and
             .migration.image == (.migration.image | sub("@.*$"; "")) + "@" + .migration.digest and
             (.backend.digest | test("^sha256:[0-9a-f]{64}$")) and
             (.migration.digest | test("^sha256:[0-9a-f]{64}$")) and
             (.backend.tested_image_id | test("^sha256:[0-9a-f]{64}$")) and
             (.migration.tested_image_id | test("^sha256:[0-9a-f]{64}$")) and
             .frontend.artifact == ("frontend-release-" + $sha) and
             (.frontend.sha256 | test("^[0-9a-f]{64}$"))' \
            "$manifest"

          expected_frontend_digest=$(jq -r '.frontend.sha256' "$manifest")
          actual_frontend_digest=$(sha256sum candidate/frontend/frontend-release.tar.gz | cut -d ' ' -f 1)
          test "$actual_frontend_digest" = "$expected_frontend_digest"

          echo "backend_image=$(jq -r '.backend.image' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "backend_digest=$(jq -r '.backend.digest' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "migration_image=$(jq -r '.migration.image' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "migration_digest=$(jq -r '.migration.digest' "$manifest")" >> "$GITHUB_OUTPUT"
          echo "frontend_digest=$actual_frontend_digest" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          cache: false

      - name: Verify published image digests
        env:
          BACKEND_IMAGE: ${{ steps.manifest.outputs.backend_image }}
          BACKEND_DIGEST: ${{ steps.manifest.outputs.backend_digest }}
          MIGRATION_IMAGE: ${{ steps.manifest.outputs.migration_image }}
          MIGRATION_DIGEST: ${{ steps.manifest.outputs.migration_digest }}
        run: |
          actual_backend_digest=$(gcloud artifacts docker images describe "$BACKEND_IMAGE" --format='value(image_summary.digest)')
          actual_migration_digest=$(gcloud artifacts docker images describe "$MIGRATION_IMAGE" --format='value(image_summary.digest)')
          test "$actual_backend_digest" = "$BACKEND_DIGEST"
          test "$actual_migration_digest" = "$MIGRATION_DIGEST"

      - name: Reject a stale queued candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_master_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq '.sha')
          test "$CANDIDATE_SHA" = "$latest_master_sha"

      - name: Run verified Flyway migrations
        env:
          MIGRATION_IMAGE: ${{ steps.manifest.outputs.migration_image }}
        run: |
          gcloud run jobs deploy db-migrate \
            --image "$MIGRATION_IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "good-news-app@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets "GOOD_NEWS_DATABASE_URL=good-news-db-url:latest" \
            --memory 512Mi \
            --max-retries 0 \
            --command java \
            --args="-jar,/app/good-news-migration.jar"
          gcloud run jobs execute db-migrate \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --wait

      - name: Deploy verified Cloud Run image
        id: cloud-run
        env:
          BACKEND_IMAGE: ${{ steps.manifest.outputs.backend_image }}
        run: |
          revision_tag="release-${CANDIDATE_SHA:0:12}"
          gcloud run deploy good-news-app \
            --image "$BACKEND_IMAGE" \
            --tag "$revision_tag" \
            --no-traffic \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "good-news-app@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 1800 \
            --port 8000 \
            --set-secrets "GOOD_NEWS_DATABASE_URL=good-news-db-url:latest,GOOD_NEWS_APP_MASTER_KEY=good-news-app-master-key:latest,GOOD_NEWS_GEMINI_API_KEY=good-news-gemini-api-key:latest" \
            --set-env-vars "^@@^GOOD_NEWS_ENV=prod@@GOOD_NEWS_PUBLIC_CONTENT_API_ORIGIN=$RUN_URL@@GOOD_NEWS_PUBLIC_FRONTEND_ORIGIN=https://${{ vars.GCP_PROJECT_ID }}.web.app@@GOOD_NEWS_FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}@@GOOD_NEWS_ALLOWED_EMAILS=${{ vars.ALLOWED_EMAILS }}@@GOOD_NEWS_SCHEDULER_INVOKER=scheduler-invoker@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com@@GOOD_NEWS_OIDC_AUDIENCE=$RUN_URL"

          gcloud run services describe good-news-app \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format=json > service.json
          revision=$(jq -r '.status.latestReadyRevisionName' service.json)
          revision_url=$(jq -r \
            --arg tag "$revision_tag" \
            --arg revision "$revision" \
            '.status.traffic[] | select(.tag == $tag and .revisionName == $revision) | .url' \
            service.json)
          test -n "$revision"
          test -n "$revision_url"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "revision_url=$revision_url" >> "$GITHUB_OUTPUT"

      - name: Health-check the newly deployed revision
        env:
          REVISION_URL: ${{ steps.cloud-run.outputs.revision_url }}
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 2 "$REVISION_URL/api/health"

      - name: Promote healthy Cloud Run revision
        env:
          REVISION: ${{ steps.cloud-run.outputs.revision }}
        run: |
          gcloud run services update-traffic good-news-app \
            --to-revisions "${REVISION}=100" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Deploy verified Firebase Hosting artifact
        run: |
          tar -xzf candidate/frontend/frontend-release.tar.gz
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

      - name: Record deployed candidate
        env:
          BACKEND_IMAGE: ${{ steps.manifest.outputs.backend_image }}
          MIGRATION_IMAGE: ${{ steps.manifest.outputs.migration_image }}
          FRONTEND_DIGEST: ${{ steps.manifest.outputs.frontend_digest }}
          REVISION: ${{ steps.cloud-run.outputs.revision }}
          REVISION_URL: ${{ steps.cloud-run.outputs.revision_url }}
        run: |
          {
            echo "## Production release"
            echo
            echo "- Commit: \`$CANDIDATE_SHA\`"
            echo "- Source CI run: \`$CANDIDATE_RUN_ID\`"
            echo "- Backend image: \`$BACKEND_IMAGE\`"
            echo "- Migration image: \`$MIGRATION_IMAGE\`"
            echo "- Frontend SHA-256: \`$FRONTEND_DIGEST\`"
            echo "- Cloud Run revision: \`$REVISION\`"
            echo "- Verified revision URL: $REVISION_URL"
          } >> "$GITHUB_STEP_SUMMARY"
