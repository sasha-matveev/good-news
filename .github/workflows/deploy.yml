name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        type: choice
        options:
          - validate
          - deploy
        default: validate
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/good-news/backend:${{ github.sha }}
  MIGRATION_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/good-news/backend-java-migration:${{ github.sha }}
  RUN_URL: https://good-news-app-446870476468.us-central1.run.app

jobs:
  validate-deploy-toolchain:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'validate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        id: gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          cache: false

      - name: Report gcloud version and authenticated identity
        run: |
          echo "Expected gcloud version: >= 363.0.0"
          echo "Installed gcloud version: ${{ steps.gcloud.outputs.version }}"
          gcloud version
          gcloud auth list --filter=status:ACTIVE
          gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" \
            --format="value(projectId)"

      - name: Validate Artifact Registry access
        run: |
          gcloud auth configure-docker \
            "${{ vars.GCP_REGION }}-docker.pkg.dev" \
            --quiet
          gcloud artifacts repositories describe good-news \
            --location="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(name)"

      - name: Validate Cloud Run job access
        run: |
          gcloud run jobs deploy --help >/dev/null
          gcloud run jobs execute --help >/dev/null
          gcloud run jobs describe db-migrate \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(metadata.name)"

      - name: Validate Cloud Run service access
        run: |
          gcloud run deploy --help >/dev/null
          gcloud run services describe good-news-app \
            --region="${{ vars.GCP_REGION }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --format="value(metadata.name)"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate Firebase Hosting access
        run: |
          npx --yes firebase-tools@latest deploy --help >/dev/null
          npx --yes firebase-tools@latest hosting:sites:list \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive

  backend-tests:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './backend[dev]'
      - name: Run backend tests
        run: pytest backend/tests/unit backend/tests/api -q

  frontend-tests:
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: npm run test --prefix frontend
      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  deploy:
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          cache: false

      - name: Build and push application and migration images
        run: |
          gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
          docker build -f backend/Dockerfile -t "$IMAGE" .
          docker build -f backend-java/migration/Dockerfile -t "$MIGRATION_IMAGE" .
          docker push "$IMAGE"
          docker push "$MIGRATION_IMAGE"

      - name: Run Flyway database migrations
        run: |
          gcloud run jobs deploy db-migrate \
            --image "$MIGRATION_IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --service-account good-news-app@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-secrets "GOOD_NEWS_DATABASE_URL=good-news-db-url:latest" \
            --memory 512Mi \
            --max-retries 0 \
            --command java \
            --args="-jar,/app/good-news-migration.jar"
          gcloud run jobs execute db-migrate \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --wait

      - name: Smoke-test Python after schema migration
        run: curl --fail --retry 6 --retry-all-errors --retry-delay 2 "$RUN_URL/api/health"

      - name: Deploy Cloud Run service
        run: |
          gcloud run deploy good-news-app \
            --image "$IMAGE" \
            --region ${{ vars.GCP_REGION }} \
            --project ${{ vars.GCP_PROJECT_ID }} \
            --service-account good-news-app@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 1800 \
            --port 8000 \
            --set-secrets "GOOD_NEWS_DATABASE_URL=good-news-db-url:latest,GOOD_NEWS_APP_MASTER_KEY=good-news-app-master-key:latest,GOOD_NEWS_GEMINI_API_KEY=good-news-gemini-api-key:latest" \
            --set-env-vars "^@@^GOOD_NEWS_ENV=prod@@GOOD_NEWS_PUBLIC_CONTENT_API_ORIGIN=$RUN_URL@@GOOD_NEWS_PUBLIC_FRONTEND_ORIGIN=https://${{ vars.GCP_PROJECT_ID }}.web.app@@GOOD_NEWS_FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}@@GOOD_NEWS_ALLOWED_EMAILS=${{ vars.ALLOWED_EMAILS }}@@GOOD_NEWS_SCHEDULER_INVOKER=scheduler-invoker@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com@@GOOD_NEWS_OIDC_AUDIENCE=$RUN_URL"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Build frontend
        env:
          VITE_CONTENT_API_ORIGIN: https://good-news-app-446870476468.us-central1.run.app
          VITE_DEPLOY_ENV: production
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      - name: Deploy Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project ${{ vars.GCP_PROJECT_ID }} --non-interactive
