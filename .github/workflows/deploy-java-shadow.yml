name: Deploy Java Shadow

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validate configuration or deploy the latest verified candidate
        type: choice
        options:
          - validate
          - deploy
        default: validate
        required: true
      candidate_run_id:
        description: Successful CI run ID (required for deploy)
        type: string
        required: false
      candidate_sha:
        description: Verified 40-character master commit SHA (required for deploy)
        type: string
        required: false

permissions:
  contents: read

jobs:
  validate-staging:
    if: inputs.operation == 'validate' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          cache: false
      - name: Validate staging resources and configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.JAVA_RUNTIME_SERVICE_ACCOUNT }}
          DATABASE_SECRET: ${{ vars.JAVA_DATABASE_URL_SECRET }}
          APP_MASTER_KEY_SECRET: ${{ vars.JAVA_APP_MASTER_KEY_SECRET }}
          GEMINI_API_KEY_SECRET: ${{ vars.JAVA_GEMINI_API_KEY_SECRET }}
          FIREBASE_PROJECT_ID: ${{ vars.JAVA_FIREBASE_PROJECT_ID }}
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          SCHEDULER_INVOKER: ${{ vars.JAVA_SCHEDULER_INVOKER }}
          OIDC_AUDIENCE: ${{ vars.JAVA_OIDC_AUDIENCE }}
          PUBLIC_CONTENT_API_ORIGIN: ${{ vars.JAVA_PUBLIC_CONTENT_API_ORIGIN }}
          PUBLIC_FRONTEND_ORIGIN: ${{ vars.JAVA_PUBLIC_FRONTEND_ORIGIN }}
        run: bash .github/scripts/validate-java-shadow-config.sh

  validate-production:
    if: inputs.operation == 'validate' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          cache: false
      - name: Validate production resources and configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.JAVA_RUNTIME_SERVICE_ACCOUNT }}
          DATABASE_SECRET: ${{ vars.JAVA_DATABASE_URL_SECRET }}
          APP_MASTER_KEY_SECRET: ${{ vars.JAVA_APP_MASTER_KEY_SECRET }}
          GEMINI_API_KEY_SECRET: ${{ vars.JAVA_GEMINI_API_KEY_SECRET }}
          FIREBASE_PROJECT_ID: ${{ vars.JAVA_FIREBASE_PROJECT_ID }}
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          SCHEDULER_INVOKER: ${{ vars.JAVA_SCHEDULER_INVOKER }}
          OIDC_AUDIENCE: ${{ vars.JAVA_OIDC_AUDIENCE }}
          PUBLIC_CONTENT_API_ORIGIN: ${{ vars.JAVA_PUBLIC_CONTENT_API_ORIGIN }}
          PUBLIC_FRONTEND_ORIGIN: ${{ vars.JAVA_PUBLIC_FRONTEND_ORIGIN }}
        run: bash .github/scripts/validate-java-shadow-config.sh

  resolve-candidate:
    if: inputs.operation == 'deploy' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      image: ${{ steps.manifest.outputs.image }}
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Verify successful CI candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > run.json
          test "$(jq -r '.name' run.json)" = CI
          test "$(jq -r '.event' run.json)" = push
          test "$(jq -r '.head_branch' run.json)" = master
          test "$(jq -r '.head_sha' run.json)" = "$CANDIDATE_SHA"
          test "$(jq -r '.conclusion' run.json)" = success
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" > jobs.json
          test "$(jq '[.jobs[] | select(.name == "Quality gate" and .conclusion == "success")] | length' jobs.json)" = 1
          latest_master_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq '.sha')
          test "$CANDIDATE_SHA" = "$latest_master_sha"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
      - name: Download release manifest
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ steps.candidate.outputs.sha }}
          path: candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Validate Java image manifest
        id: manifest
        env:
          RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          manifest=candidate/release-manifest.json
          jq -e \
            --arg sha "$CANDIDATE_SHA" \
            --arg run_id "$RUN_ID" \
            '.schema_version == 2 and
             .source_sha == $sha and
             .source_run_id == $run_id and
             .java.image == (.java.image | sub("@.*$"; "")) + "@" + .java.digest and
             (.java.digest | test("^sha256:[0-9a-f]{64}$")) and
             (.java.tested_image_id | test("^sha256:[0-9a-f]{64}$"))' \
            "$manifest"
          echo "image=$(jq -r '.java.image' "$manifest")" >> "$GITHUB_OUTPUT"

  deploy-staging:
    needs: resolve-candidate
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: java-shadow-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      revision_url: ${{ steps.deploy.outputs.revision_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          cache: false
      - name: Verify published image digest
        env:
          IMAGE: ${{ needs.resolve-candidate.outputs.image }}
        run: test "$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')" = "${IMAGE##*@}"
      - name: Deploy staging Java service
        id: deploy
        env:
          IMAGE: ${{ needs.resolve-candidate.outputs.image }}
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
          SERVICE: good-news-java-staging
          SHADOW_ENVIRONMENT: staging
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.JAVA_RUNTIME_SERVICE_ACCOUNT }}
          DATABASE_SECRET: ${{ vars.JAVA_DATABASE_URL_SECRET }}
          APP_MASTER_KEY_SECRET: ${{ vars.JAVA_APP_MASTER_KEY_SECRET }}
          GEMINI_API_KEY_SECRET: ${{ vars.JAVA_GEMINI_API_KEY_SECRET }}
          FIREBASE_PROJECT_ID: ${{ vars.JAVA_FIREBASE_PROJECT_ID }}
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          SCHEDULER_INVOKER: ${{ vars.JAVA_SCHEDULER_INVOKER }}
          OIDC_AUDIENCE: ${{ vars.JAVA_OIDC_AUDIENCE }}
          PUBLIC_CONTENT_API_ORIGIN: ${{ vars.JAVA_PUBLIC_CONTENT_API_ORIGIN }}
          PUBLIC_FRONTEND_ORIGIN: ${{ vars.JAVA_PUBLIC_FRONTEND_ORIGIN }}
        run: bash .github/scripts/deploy-java-shadow.sh
      - name: Smoke public health
        env:
          REVISION_URL: ${{ steps.deploy.outputs.revision_url }}
        run: curl --fail --retry 24 --retry-all-errors --retry-delay 2 "$REVISION_URL/api/health"

  deploy-production-shadow:
    needs:
      - resolve-candidate
      - deploy-staging
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: java-shadow-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-candidate.outputs.sha }}
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          cache: false
      - name: Deploy production Java shadow with no traffic
        id: deploy
        env:
          IMAGE: ${{ needs.resolve-candidate.outputs.image }}
          CANDIDATE_SHA: ${{ needs.resolve-candidate.outputs.sha }}
          SERVICE: good-news-java
          SHADOW_ENVIRONMENT: prod
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.JAVA_RUNTIME_SERVICE_ACCOUNT }}
          DATABASE_SECRET: ${{ vars.JAVA_DATABASE_URL_SECRET }}
          APP_MASTER_KEY_SECRET: ${{ vars.JAVA_APP_MASTER_KEY_SECRET }}
          GEMINI_API_KEY_SECRET: ${{ vars.JAVA_GEMINI_API_KEY_SECRET }}
          FIREBASE_PROJECT_ID: ${{ vars.JAVA_FIREBASE_PROJECT_ID }}
          ALLOWED_EMAILS: ${{ vars.ALLOWED_EMAILS }}
          SCHEDULER_INVOKER: ${{ vars.JAVA_SCHEDULER_INVOKER }}
          OIDC_AUDIENCE: ${{ vars.JAVA_OIDC_AUDIENCE }}
          PUBLIC_CONTENT_API_ORIGIN: ${{ vars.JAVA_PUBLIC_CONTENT_API_ORIGIN }}
          PUBLIC_FRONTEND_ORIGIN: ${{ vars.JAVA_PUBLIC_FRONTEND_ORIGIN }}
        run: bash .github/scripts/deploy-java-shadow.sh
      - name: Smoke public production health directly
        env:
          REVISION_URL: ${{ steps.deploy.outputs.revision_url }}
        run: curl --fail --retry 24 --retry-all-errors --retry-delay 2 "$REVISION_URL/api/health"
      - name: Prove production ownership remains on Python
        run: |
          if git grep -q ': "java"' -- frontend/src/lib/api.ts; then
            echo "Production operation ownership must remain fully on Python" >&2
            exit 1
          fi
          gcloud run services describe good-news-java \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format=json > service.json
          test "$(jq '[.status.traffic[] | select((.tag // "") == "" and (.percent // 0) > 0)] | length' service.json)" = 0
      - name: Record shadow deployment
        env:
          IMAGE: ${{ needs.resolve-candidate.outputs.image }}
          STAGING_URL: ${{ needs.deploy-staging.outputs.revision_url }}
          PRODUCTION_URL: ${{ steps.deploy.outputs.revision_url }}
        run: |
          {
            echo "## Java production shadow"
            echo
            echo "- Commit: \`${{ needs.resolve-candidate.outputs.sha }}\`"
            echo "- Image: \`$IMAGE\`"
            echo "- Staging URL: $STAGING_URL"
            echo "- Controlled production URL: $PRODUCTION_URL"
            echo "- Normal production traffic: 0%"
          } >> "$GITHUB_STEP_SUMMARY"
