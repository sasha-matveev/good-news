name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend_java: ${{ steps.filter.outputs.backend_java }}
      contract_harness: ${{ steps.filter.outputs.contract_harness }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend_java:
              - 'backend-java/**'
            contract_harness:
              - 'contract-harness/**'
              - 'backend/**'
              - 'backend-java/**'
            shared:
              - '.github/workflows/ci.yml'

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './backend[dev]'
      - name: Run backend tests
        run: pytest backend/tests/unit backend/tests/api -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: npm run test --prefix frontend

  backend-java:
    needs: changes
    if: needs.changes.outputs.backend_java == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Run backend-java tests
        run: ./mvnw -B verify

  differential-contract:
    needs: changes
    if: needs.changes.outputs.contract_harness == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contract-harness/pyproject.toml
      - name: Install contract harness
        run: python -m pip install -e './contract-harness[dev]'
      - name: Prove mismatch diagnostics
        run: pytest contract-harness/tests -q
      - name: Run isolated-database differential contract
        run: ./contract-harness/run-local.sh
      - name: Run shared-database read-only smoke
        run: ./contract-harness/run-read-only.sh
      - name: Publish parity reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-parity-reports
          path: artifacts/backend-parity*.md
          if-no-files-found: warn
