name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend_java: ${{ steps.filter.outputs.backend_java }}
      contract_harness: ${{ steps.filter.outputs.contract_harness }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend_java:
              - 'backend-java/**'
            contract_harness:
              - 'contract-harness/**'
              - 'backend/**'
              - 'backend-java/**'
            shared:
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './backend[dev]'
      - name: Run backend tests
        run: pytest backend/tests/unit backend/tests/api -q

  production-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: good_news
          POSTGRES_USER: good_news
          POSTGRES_PASSWORD: good_news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U good_news -d good_news"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOOD_NEWS_DATABASE_URL: postgresql+psycopg://good_news:good_news@127.0.0.1:5432/good_news
      IMAGE: good-news-backend:ci
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f backend/Dockerfile -t "$IMAGE" .
      - name: Verify Python runtime and dependencies
        run: |
          docker run --rm "$IMAGE" python -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
          docker run --rm "$IMAGE" python -c 'from psycopg import pq; assert pq.__impl__ == "binary", pq.__impl__'
          docker run --rm "$IMAGE" python -m pip check
      - name: Run database migrations
        run: |
          docker run --rm \
            --network host \
            --env GOOD_NEWS_DATABASE_URL \
            "$IMAGE" \
            python -m app.core.migration_runner
      - name: Start production container
        run: |
          docker run --detach \
            --name good-news-backend \
            --network host \
            --env GOOD_NEWS_DATABASE_URL \
            "$IMAGE"
      - name: Smoke-test container health
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/api/health
      - name: Show container logs
        if: failure()
        run: docker logs good-news-backend || true
      - name: Stop production container
        if: always()
        run: docker rm --force good-news-backend || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: npm run test --prefix frontend

  backend-java:
    needs: changes
    if: needs.changes.outputs.backend_java == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - name: Run backend-java tests
        run: ./mvnw -B verify

  differential-contract:
    needs: changes
    if: needs.changes.outputs.contract_harness == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contract-harness/pyproject.toml
      - name: Install contract harness
        run: python -m pip install -e './contract-harness[dev]'
      - name: Prove mismatch diagnostics
        run: pytest contract-harness/tests -q
      - name: Run isolated-database differential contract
        run: ./contract-harness/run-local.sh
      - name: Run shared-database read-only smoke
        run: ./contract-harness/run-read-only.sh
      - name: Publish parity reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-parity-reports
          path: artifacts/backend-parity*.md
          if-no-files-found: warn
