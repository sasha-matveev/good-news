name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

env:
  RUN_URL: https://good-news-app-446870476468.us-central1.run.app

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend_python: ${{ steps.filter.outputs.backend_python }}
      backend_java: ${{ steps.filter.outputs.backend_java }}
      frontend: ${{ steps.filter.outputs.frontend }}
      contract: ${{ steps.filter.outputs.contract }}
      pipeline: ${{ steps.filter.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend_python:
              - 'backend/**'
            backend_java:
              - 'backend-java/**'
              - 'backend/alembic/**'
            frontend:
              - 'frontend/**'
              - 'firebase.json'
            contract:
              - 'contract-harness/**'
              - 'backend/**'
              - 'backend-java/**'
            pipeline:
              - '.github/workflows/ci.yml'

  backend-python:
    name: Python backend
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.backend_python == 'true' ||
      needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: good-news-backend:ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Test
        run: pytest backend/tests/unit backend/tests/api -q
      - name: Build image
        run: docker build -f backend/Dockerfile -t "$IMAGE" .
      - name: Verify image
        run: |
          docker run --rm "$IMAGE" python -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
          docker run --rm "$IMAGE" python -m pip check
      - name: Package image for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save "$IMAGE" | gzip -1 > backend-image.tar.gz
      - name: Upload image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: backend-image
          path: backend-image.tar.gz
          compression-level: 0
          if-no-files-found: error

  backend-java:
    name: Java backend
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.backend_java == 'true' ||
      needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: good-news-backend-java:ci
      MIGRATION_IMAGE: good-news-backend-java-migration:ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/**/pom.xml
      - name: Test
        working-directory: backend-java
        run: ./mvnw -B verify
      - name: Build images
        run: |
          docker build -f backend-java/application/Dockerfile -t "$IMAGE" .
          docker build -f backend-java/migration/Dockerfile -t "$MIGRATION_IMAGE" .
      - name: Package images for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save "$IMAGE" "$MIGRATION_IMAGE" | gzip -1 > java-images.tar.gz
      - name: Upload images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: java-images
          path: java-images.tar.gz
          compression-level: 0
          if-no-files-found: error

  frontend:
    name: Frontend
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Test
        run: npm run test --prefix frontend
      - name: Typecheck
        run: npm run typecheck --prefix frontend
      - name: Build
        env:
          VITE_CONTENT_API_ORIGIN: ${{ env.RUN_URL }}
          VITE_DEPLOY_ENV: production
        run: npm run build --prefix frontend
      - name: Package for deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: tar -czf frontend.tar.gz firebase.json frontend/dist
      - name: Upload build
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: frontend.tar.gz
          if-no-files-found: error

  contract:
    name: Backend contract
    needs: changes
    if: >-
      github.event_name == 'push' ||
      needs.changes.outputs.contract == 'true' ||
      needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contract-harness/pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e './contract-harness[dev]'
      - name: Test harness
        run: pytest contract-harness/tests -q
      - name: Compare backends
        run: |
          ./contract-harness/run-local.sh
          ./contract-harness/run-read-only.sh

  quality-gate:
    name: Quality gate
    if: always()
    needs:
      - changes
      - backend-python
      - backend-java
      - frontend
      - contract
    runs-on: ubuntu-latest
    steps:
      - name: Require all applicable jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          BACKEND_PYTHON: ${{ needs.backend-python.result }}
          BACKEND_JAVA: ${{ needs.backend-java.result }}
          FRONTEND: ${{ needs.frontend.result }}
          CONTRACT: ${{ needs.contract.result }}
        run: |
          test "$CHANGES" = success
          for result in "$BACKEND_PYTHON" "$BACKEND_JAVA" "$FRONTEND" "$CONTRACT"; do
            test "$result" = success || test "$result" = skipped
          done

  deploy:
    name: Deploy
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    needs:
      - quality-gate
      - backend-python
      - backend-java
      - frontend
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      BACKEND_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/good-news/backend:${{ github.sha }}
      JAVA_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/good-news/backend-java:${{ github.sha }}
      MIGRATION_IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/good-news/backend-java-migration:${{ github.sha }}
    steps:
      - name: Download Python image
        uses: actions/download-artifact@v8
        with:
          name: backend-image
      - name: Download Java images
        uses: actions/download-artifact@v8
        with:
          name: java-images
      - name: Download frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Publish images
        run: |
          gzip -dc backend-image.tar.gz | docker load
          gzip -dc java-images.tar.gz | docker load
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker tag good-news-backend:ci "$BACKEND_IMAGE"
          docker tag good-news-backend-java:ci "$JAVA_IMAGE"
          docker tag good-news-backend-java-migration:ci "$MIGRATION_IMAGE"
          docker push "$BACKEND_IMAGE"
          docker push "$JAVA_IMAGE"
          docker push "$MIGRATION_IMAGE"
      - name: Migrate database
        run: |
          gcloud run jobs deploy db-migrate \
            --image "$MIGRATION_IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "good-news-app@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets "GOOD_NEWS_DATABASE_URL=good-news-db-url:latest" \
            --memory 512Mi \
            --max-retries 0 \
            --command java \
            --args="-jar,/app/good-news-migration.jar"
          gcloud run jobs execute db-migrate \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --wait
      - name: Deploy Python backend
        run: |
          gcloud run deploy good-news-app \
            --image "$BACKEND_IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "good-news-app@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 1800 \
            --port 8000 \
            --set-secrets "GOOD_NEWS_DATABASE_URL=good-news-db-url:latest,GOOD_NEWS_APP_MASTER_KEY=good-news-app-master-key:latest,GOOD_NEWS_GEMINI_API_KEY=good-news-gemini-api-key:latest" \
            --set-env-vars "^@@^GOOD_NEWS_ENV=prod@@GOOD_NEWS_PUBLIC_CONTENT_API_ORIGIN=$RUN_URL@@GOOD_NEWS_PUBLIC_FRONTEND_ORIGIN=https://${{ vars.GCP_PROJECT_ID }}.web.app@@GOOD_NEWS_FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}@@GOOD_NEWS_ALLOWED_EMAILS=${{ vars.ALLOWED_EMAILS }}@@GOOD_NEWS_SCHEDULER_INVOKER=scheduler-invoker@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com@@GOOD_NEWS_OIDC_AUDIENCE=$RUN_URL"
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 "$RUN_URL/api/health"
      - name: Deploy Java backend
        run: |
          gcloud run deploy good-news-java \
            --image "$JAVA_IMAGE" \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "${{ vars.JAVA_RUNTIME_SERVICE_ACCOUNT || format('good-news-app@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 1 \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 20 \
            --timeout 300 \
            --port 8080 \
            --startup-probe="httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=3,periodSeconds=5,failureThreshold=12" \
            --set-secrets="GOOD_NEWS_DATABASE_URL=${{ vars.JAVA_DATABASE_URL_SECRET || 'good-news-db-url' }}:latest,GOOD_NEWS_APP_MASTER_KEY=${{ vars.JAVA_APP_MASTER_KEY_SECRET || 'good-news-app-master-key' }}:latest,GOOD_NEWS_GEMINI_API_KEY=${{ vars.JAVA_GEMINI_API_KEY_SECRET || 'good-news-gemini-api-key' }}:latest" \
            --set-env-vars="^@@^GOOD_NEWS_ENV=prod@@GOOD_NEWS_DATABASE_POOL_INITIAL_SIZE=0@@GOOD_NEWS_DATABASE_POOL_MAX_SIZE=4@@GOOD_NEWS_DATABASE_POOL_ACQUIRE_TIMEOUT=2s@@GOOD_NEWS_DATABASE_CONNECT_TIMEOUT=5s@@GOOD_NEWS_DATABASE_OPERATION_TIMEOUT=30s@@GOOD_NEWS_DATABASE_POOL_IDLE_TIMEOUT=10m@@GOOD_NEWS_DATABASE_POOL_MAX_LIFE_TIME=30m@@GOOD_NEWS_FIREBASE_PROJECT_ID=${{ vars.JAVA_FIREBASE_PROJECT_ID || vars.GCP_PROJECT_ID }}@@GOOD_NEWS_ALLOWED_EMAILS=${{ vars.ALLOWED_EMAILS }}@@GOOD_NEWS_SCHEDULER_INVOKER=${{ vars.JAVA_SCHEDULER_INVOKER || format('scheduler-invoker@{0}.iam.gserviceaccount.com', vars.GCP_PROJECT_ID) }}@@GOOD_NEWS_OIDC_AUDIENCE=${{ vars.JAVA_OIDC_AUDIENCE || env.RUN_URL }}@@GOOD_NEWS_PUBLIC_CONTENT_API_ORIGIN=${{ vars.JAVA_PUBLIC_CONTENT_API_ORIGIN || env.RUN_URL }}@@GOOD_NEWS_PUBLIC_FRONTEND_ORIGIN=${{ vars.JAVA_PUBLIC_FRONTEND_ORIGIN || format('https://{0}.web.app', vars.GCP_PROJECT_ID) }}"
          java_url=$(gcloud run services describe good-news-java \
            --region "${{ vars.GCP_REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --format='value(status.url)')
          curl --fail --retry 24 --retry-all-errors --retry-delay 2 "$java_url/api/health"
      - name: Deploy frontend
        run: |
          tar -xzf frontend.tar.gz
          npx --yes firebase-tools@latest deploy \
            --only hosting \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --non-interactive
      - name: Summary
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Python: \`$BACKEND_IMAGE\`"
            echo "- Java: \`$JAVA_IMAGE\`"
            echo "- Migration: \`$MIGRATION_IMAGE\`"
            echo "- Frontend: Firebase Hosting"
          } >> "$GITHUB_STEP_SUMMARY"
