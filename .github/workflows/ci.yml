name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

env:
  CANDIDATE_RETENTION_DAYS: 14

jobs:
  plan:
    name: Plan applicable checks
    runs-on: ubuntu-latest
    outputs:
      backend_python: ${{ steps.filter.outputs.backend_python }}
      production_image: ${{ steps.filter.outputs.production_image }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend_java: ${{ steps.filter.outputs.backend_java }}
      contract_harness: ${{ steps.filter.outputs.contract_harness }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend_python:
              - 'backend/**'
            production_image:
              - 'backend/**'
              - 'backend-java/**'
            frontend:
              - 'frontend/**'
              - 'firebase.json'
            backend_java:
              - 'backend-java/**'
              - 'backend/alembic/**'
            contract_harness:
              - 'contract-harness/**'
              - 'backend/**'
              - 'backend-java/**'
            shared:
              - '.github/workflows/ci.yml'

  backend:
    needs: plan
    if: >-
      github.event_name == 'push' ||
      needs.plan.outputs.backend_python == 'true' ||
      needs.plan.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './backend[dev]'
      - name: Run backend tests
        run: |
          mkdir -p artifacts
          pytest backend/tests/unit backend/tests/api -q \
            --junitxml=artifacts/backend-tests.xml
      - name: Backend test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: artifacts/backend-tests.xml

  production-image:
    needs: plan
    if: >-
      github.event_name == 'push' ||
      needs.plan.outputs.production_image == 'true' ||
      needs.plan.outputs.shared == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: good_news
          POSTGRES_USER: good_news
          POSTGRES_PASSWORD: good_news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U good_news -d good_news"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GOOD_NEWS_DATABASE_URL: postgresql+psycopg://good_news:good_news@127.0.0.1:5432/good_news
      IMAGE: good-news-backend:ci
      MIGRATION_IMAGE: good-news-backend-java-migration:ci
    steps:
      - uses: actions/checkout@v7
      - name: Build production images once
        run: |
          docker build -f backend/Dockerfile -t "$IMAGE" .
          docker build -f backend-java/migration/Dockerfile -t "$MIGRATION_IMAGE" .
      - name: Verify Python runtime and dependencies
        run: |
          docker run --rm "$IMAGE" python -c 'import sys; assert sys.version_info[:2] == (3, 14), sys.version'
          docker run --rm "$IMAGE" python -c 'from psycopg import pq; assert pq.__impl__ == "binary", pq.__impl__'
          docker run --rm "$IMAGE" python -m pip check
      - name: Run Flyway database migrations
        run: |
          docker run --rm \
            --network host \
            --env GOOD_NEWS_DATABASE_URL \
            "$MIGRATION_IMAGE"
      - name: Confirm repeated Flyway invocation is safe
        run: |
          docker run --rm \
            --network host \
            --env GOOD_NEWS_DATABASE_URL \
            "$MIGRATION_IMAGE"
      - name: Start production container
        run: |
          docker run --detach \
            --name good-news-backend \
            --network host \
            --env GOOD_NEWS_DATABASE_URL \
            "$IMAGE"
      - name: Smoke-test container health
        run: curl --fail --retry 12 --retry-all-errors --retry-delay 1 http://127.0.0.1:8000/api/health
      - name: Show container logs
        if: failure()
        run: docker logs good-news-backend || true
      - name: Stop production container
        if: always()
        run: docker rm --force good-news-backend || true
      - name: Package tested images for trusted publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          jq -n \
            --arg backend_image_id "$(docker image inspect --format '{{.Id}}' "$IMAGE")" \
            --arg migration_image_id "$(docker image inspect --format '{{.Id}}' "$MIGRATION_IMAGE")" \
            '{backend_image_id: $backend_image_id, migration_image_id: $migration_image_id}' \
            > release-image-identities.json
          docker save "$IMAGE" "$MIGRATION_IMAGE" | gzip -1 > release-images.tar.gz
      - name: Upload tested image candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: release-images-${{ github.sha }}
          path: |
            release-images.tar.gz
            release-image-identities.json
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

  frontend:
    needs: plan
    if: >-
      github.event_name == 'push' ||
      needs.plan.outputs.frontend == 'true' ||
      needs.plan.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend tests
        run: npm run test --prefix frontend
      - name: Typecheck frontend
        run: npm run typecheck --prefix frontend
      - name: Build production frontend once
        env:
          VITE_CONTENT_API_ORIGIN: https://good-news-app-446870476468.us-central1.run.app
          VITE_DEPLOY_ENV: production
        run: npm run build --prefix frontend
      - name: Package production frontend
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: tar -czf frontend-release.tar.gz firebase.json frontend/dist
      - name: Upload production frontend candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-release-${{ github.sha }}
          path: frontend-release.tar.gz
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}

  backend-java:
    needs: plan
    if: >-
      github.event_name == 'push' ||
      needs.plan.outputs.backend_java == 'true' ||
      needs.plan.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/**/pom.xml
      - name: Run backend-java tests
        run: ./mvnw -B verify
      - name: Backend Java test summary
        if: always()
        uses: test-summary/action@v2
        with:
          paths: |
            backend-java/**/target/surefire-reports/TEST-*.xml
            backend-java/**/target/failsafe-reports/TEST-*.xml

  differential-contract:
    needs: plan
    if: >-
      github.event_name == 'push' ||
      needs.plan.outputs.contract_harness == 'true' ||
      needs.plan.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: contract-harness/pyproject.toml
      - name: Install contract harness
        run: python -m pip install -e './contract-harness[dev]'
      - name: Prove mismatch diagnostics
        run: pytest contract-harness/tests -q
      - name: Run isolated-database differential contract
        run: ./contract-harness/run-local.sh
      - name: Run shared-database read-only smoke
        run: ./contract-harness/run-read-only.sh
      - name: Publish parity reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-parity-reports
          path: artifacts/backend-parity*.md
          if-no-files-found: warn

  quality-gate:
    name: Quality gate
    needs:
      - plan
      - backend
      - production-image
      - frontend
      - backend-java
      - differential-contract
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          PRODUCTION_IMAGE_RESULT: ${{ needs.production-image.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_JAVA_RESULT: ${{ needs.backend-java.result }}
          CONTRACT_RESULT: ${{ needs.differential-contract.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$PLAN_RESULT" = success
          if [ "$EVENT_NAME" = push ]; then
            test "$BACKEND_RESULT" = success
            test "$PRODUCTION_IMAGE_RESULT" = success
            test "$FRONTEND_RESULT" = success
            test "$BACKEND_JAVA_RESULT" = success
            test "$CONTRACT_RESULT" = success
          else
            test "$BACKEND_RESULT" = success || test "$BACKEND_RESULT" = skipped
            test "$PRODUCTION_IMAGE_RESULT" = success || test "$PRODUCTION_IMAGE_RESULT" = skipped
            test "$FRONTEND_RESULT" = success || test "$FRONTEND_RESULT" = skipped
            test "$BACKEND_JAVA_RESULT" = success || test "$BACKEND_JAVA_RESULT" = skipped
            test "$CONTRACT_RESULT" = success || test "$CONTRACT_RESULT" = skipped
          fi

  publish-candidate:
    needs: quality-gate
    if: >-
      needs.quality-gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/good-news
      BACKEND_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/good-news/backend:${{ github.sha }}
      MIGRATION_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/good-news/backend-java-migration:${{ github.sha }}
    steps:
      - name: Download tested images
        uses: actions/download-artifact@v8
        with:
          name: release-images-${{ github.sha }}
      - name: Download production frontend
        uses: actions/download-artifact@v8
        with:
          name: frontend-release-${{ github.sha }}
          path: frontend-candidate
      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 363.0.0"
          cache: false
      - name: Publish tested images
        id: images
        run: |
          gzip -dc release-images.tar.gz | docker load
          backend_image_id=$(docker image inspect --format '{{.Id}}' good-news-backend:ci)
          migration_image_id=$(docker image inspect --format '{{.Id}}' good-news-backend-java-migration:ci)
          test "$backend_image_id" = "$(jq -r '.backend_image_id' release-image-identities.json)"
          test "$migration_image_id" = "$(jq -r '.migration_image_id' release-image-identities.json)"

          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker tag good-news-backend:ci "$BACKEND_TAG"
          docker tag good-news-backend-java-migration:ci "$MIGRATION_TAG"
          docker push "$BACKEND_TAG"
          docker push "$MIGRATION_TAG"

          backend_digest=$(gcloud artifacts docker images describe "$BACKEND_TAG" --format='value(image_summary.digest)')
          migration_digest=$(gcloud artifacts docker images describe "$MIGRATION_TAG" --format='value(image_summary.digest)')
          test -n "$backend_digest"
          test -n "$migration_digest"
          echo "backend_image_id=$backend_image_id" >> "$GITHUB_OUTPUT"
          echo "migration_image_id=$migration_image_id" >> "$GITHUB_OUTPUT"
          echo "backend_digest=$backend_digest" >> "$GITHUB_OUTPUT"
          echo "migration_digest=$migration_digest" >> "$GITHUB_OUTPUT"
          echo "backend_image=${REGISTRY}/backend@${backend_digest}" >> "$GITHUB_OUTPUT"
          echo "migration_image=${REGISTRY}/backend-java-migration@${migration_digest}" >> "$GITHUB_OUTPUT"
      - name: Verify and write release manifest
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend_image }}
          BACKEND_IMAGE_ID: ${{ steps.images.outputs.backend_image_id }}
          BACKEND_DIGEST: ${{ steps.images.outputs.backend_digest }}
          MIGRATION_IMAGE: ${{ steps.images.outputs.migration_image }}
          MIGRATION_IMAGE_ID: ${{ steps.images.outputs.migration_image_id }}
          MIGRATION_DIGEST: ${{ steps.images.outputs.migration_digest }}
        run: |
          actual_frontend_digest=$(sha256sum frontend-candidate/frontend-release.tar.gz | cut -d ' ' -f 1)
          jq -n \
            --arg source_sha "$GITHUB_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg backend_image_id "$BACKEND_IMAGE_ID" \
            --arg backend_digest "$BACKEND_DIGEST" \
            --arg migration_image "$MIGRATION_IMAGE" \
            --arg migration_image_id "$MIGRATION_IMAGE_ID" \
            --arg migration_digest "$MIGRATION_DIGEST" \
            --arg frontend_artifact "frontend-release-${GITHUB_SHA}" \
            --arg frontend_digest "$actual_frontend_digest" \
            '{
              schema_version: 1,
              source_sha: $source_sha,
              source_run_id: $run_id,
              backend: {
                image: $backend_image,
                digest: $backend_digest,
                tested_image_id: $backend_image_id
              },
              migration: {
                image: $migration_image,
                digest: $migration_digest,
                tested_image_id: $migration_image_id
              },
              frontend: {artifact: $frontend_artifact, sha256: $frontend_digest}
            }' > release-manifest.json
      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: ${{ env.CANDIDATE_RETENTION_DAYS }}
