server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/sources/sync {
        proxy_pass http://content-api-service:8000;
        proxy_read_timeout 930s;
    }

    location /api/ {
        proxy_pass http://content-api-service:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
