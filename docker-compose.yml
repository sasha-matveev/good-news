services:
  postgres:
    image: postgres:16
    cpus: 1.0
    environment:
      POSTGRES_DB: ${GOOD_NEWS_POSTGRES_DATABASE:-good_news}
      POSTGRES_USER: ${GOOD_NEWS_POSTGRES_USER:-good_news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    mem_limit: 512m
    ports:
      - "${GOOD_NEWS_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    cpus: 0.5
    profiles: ["migration"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOD_NEWS_ENV: ${GOOD_NEWS_ENV:-dev}
      GOOD_NEWS_POSTGRES_HOST: postgres
      GOOD_NEWS_POSTGRES_PORT: 5432
      GOOD_NEWS_POSTGRES_DATABASE: ${GOOD_NEWS_POSTGRES_DATABASE:-good_news}
      GOOD_NEWS_POSTGRES_USER: ${GOOD_NEWS_POSTGRES_USER:-good_news}
      GOOD_NEWS_POSTGRES_PASSWORD: ${GOOD_NEWS_POSTGRES_PASSWORD:?GOOD_NEWS_POSTGRES_PASSWORD must be set}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    mem_limit: 256m
    command: python -m app.core.migration_runner

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOOD_NEWS_ENV: ${GOOD_NEWS_ENV:-dev}
      GOOD_NEWS_CONTENT_API_SERVICE_HOST: 0.0.0.0
      GOOD_NEWS_CONTENT_API_SERVICE_PORT: ${GOOD_NEWS_CONTENT_API_SERVICE_PORT:-8000}
      GOOD_NEWS_FRONTEND_PORT: ${GOOD_NEWS_FRONTEND_HOST_PORT:-5173}
      GOOD_NEWS_PUBLIC_CONTENT_API_ORIGIN: ${GOOD_NEWS_PUBLIC_CONTENT_API_ORIGIN:?GOOD_NEWS_PUBLIC_CONTENT_API_ORIGIN must be set}
      GOOD_NEWS_PUBLIC_FRONTEND_ORIGIN: ${GOOD_NEWS_PUBLIC_FRONTEND_ORIGIN:?GOOD_NEWS_PUBLIC_FRONTEND_ORIGIN must be set}
      GOOD_NEWS_POSTGRES_HOST: postgres
      GOOD_NEWS_POSTGRES_PORT: 5432
      GOOD_NEWS_POSTGRES_DATABASE: ${GOOD_NEWS_POSTGRES_DATABASE:-good_news}
      GOOD_NEWS_POSTGRES_USER: ${GOOD_NEWS_POSTGRES_USER:-good_news}
      GOOD_NEWS_POSTGRES_PASSWORD: ${GOOD_NEWS_POSTGRES_PASSWORD:?GOOD_NEWS_POSTGRES_PASSWORD must be set}
      GOOD_NEWS_APP_MASTER_KEY: ${GOOD_NEWS_APP_MASTER_KEY:?GOOD_NEWS_APP_MASTER_KEY must be set}
      GOOD_NEWS_OLLAMA_HOST: ollama
      GOOD_NEWS_OLLAMA_PORT: 11434
      GOOD_NEWS_OLLAMA_MODEL: ${GOOD_NEWS_OLLAMA_MODEL:-llama3.2:3b-instruct-q4_K_M}
      GOOD_NEWS_ANALYSIS_STUB_RESPONSE_JSON: ${GOOD_NEWS_ANALYSIS_STUB_RESPONSE_JSON:-}
      GOOD_NEWS_INGESTION_RESPONSES_JSON: ${GOOD_NEWS_INGESTION_RESPONSES_JSON:-}
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    mem_limit: 512m
    ports:
      - "${GOOD_NEWS_CONTENT_API_SERVICE_HOST_PORT:-8000}:8000"
    command: sh /app/backend/scripts/start-app.sh
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    cpus: 0.5
    depends_on:
      app:
        condition: service_healthy
    environment:
      VITE_CONTENT_API_ORIGIN: http://app:8000
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    mem_limit: 256m
    ports:
      - "${GOOD_NEWS_FRONTEND_HOST_PORT:-5173}:5173"
    profiles: ["ui"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  smtp:
    image: mailhog/mailhog:v1.0.1
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    mem_limit: 128m
    ports:
      - "${GOOD_NEWS_SMTP_HOST_PORT:-1025}:1025"
      - "${GOOD_NEWS_SMTP_UI_HOST_PORT:-8025}:8025"
    profiles: ["verification"]

  ollama:
    image: ollama/ollama:latest
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    mem_limit: 6g
    ports:
      - "${GOOD_NEWS_OLLAMA_HOST_PORT:-11434}:11434"
    profiles: ["ai"]
    volumes:
      - ollama-data:/root/.ollama

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    mem_limit: 512m
    ports:
      - "${GOOD_NEWS_OBSERVABILITY_PROMETHEUS_HOST_PORT:-9090}:9090"
    profiles: ["observability"]
    volumes:
      - prometheus-data:/prometheus
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  grafana:
    image: grafana/grafana-oss:11.2.0
    cpus: 0.5
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: "10m"
    mem_limit: 512m
    ports:
      - "${GOOD_NEWS_OBSERVABILITY_GRAFANA_HOST_PORT:-3000}:3000"
    profiles: ["observability"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  grafana-data:
  ollama-data:
  postgres-data:
  prometheus-data:
